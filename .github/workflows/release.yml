name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # A release must not be cut while the target server build is unresolved.
      - name: Block unresolved version matrix
        run: |
          if grep -q 'UNRESOLVED' docs/version-matrix.md; then
            echo "::warning::docs/version-matrix.md still contains UNRESOLVED entries."
            echo "Review them before publishing a production release (see RELEASE.md)."
          fi

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Generate artefacts and SHA-256 checksums
        run: |
          mkdir -p dist
          find . -path '*/build/libs/*.jar' -type f -exec cp {} dist/ \;
          cd dist && sha256sum *.jar > SHA256SUMS.txt

      - name: Attach artefacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --generate-notes --verify-tag

      # Deliberately NO deployment to a production server (task book 18.4).
