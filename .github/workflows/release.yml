name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate tag ref
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "::error::Release must run on a tag; workflow_dispatch on a branch is not supported."
            exit 1
          fi
          echo "Releasing ${GITHUB_REF_NAME}"

      # A STABLE release must not be cut while the target server build is
      # unresolved. Experimental pre-release tags are allowed (and marked as
      # pre-releases), but their unresolved entries are printed for review.
      - name: Enforce resolved version matrix
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc|p0|experimental) ]]; then
            echo "Experimental pre-release: UNRESOLVED entries are permitted but listed below."
            grep -n 'UNRESOLVED' docs/version-matrix.md || true
          elif grep -q 'UNRESOLVED' docs/version-matrix.md; then
            echo "::error::Refusing a stable release: docs/version-matrix.md still has UNRESOLVED entries."
            echo "Pin and verify the Purpur build before tagging (see RELEASE.md)."
            exit 1
          fi

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Generate artefacts and SHA-256 checksums
        run: |
          mkdir -p dist
          find . -path '*/build/libs/*.jar' -type f -exec cp {} dist/ \;
          cd dist && sha256sum *.jar > SHA256SUMS.txt

      - name: Attach artefacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ -(alpha|beta|rc|p0|experimental) ]]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --generate-notes --verify-tag --prerelease
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --generate-notes --verify-tag
          fi

      # Deliberately NO deployment to a production server (task book 18.4).
