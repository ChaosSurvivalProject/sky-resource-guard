name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# Superseded pushes/PR updates should not burn runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate JSON Schemas
        run: |
          python3 -m pip install --quiet jsonschema
          python3 tools/validate-schemas.py

      - name: Style / static checks (equivalent to Spotless + Checkstyle)
        run: |
          bash tools/check-style.sh
          bash tools/check-dependencies.sh

      - name: Security-sensitive pattern scan
        run: bash tools/scan-sensitive.sh

      - name: Build, unit tests and javadoc
        run: ./gradlew clean build javadoc --no-daemon

      - name: Verify AI-generated adapter and installable jar
        run: |
          python3 tools/verify-generated-adapters.py
          bash tools/check-plugin-jar.sh
          bash tools/check-autodiscovery.sh

      - name: Publish PR test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test/**
            **/build/reports/javadoc/**
          if-no-files-found: warn
