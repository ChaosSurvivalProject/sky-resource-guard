name: Bug report
description: Report a reproducible defect in SKY Resource Guard
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** include player UUIDs, IPs, chat logs, item NBT, world
        files or API keys. For security issues use a private security advisory.
  - type: input
    id: version
    attributes:
      label: SKY version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Java version, server fork/build, OS. Write UNRESOLVED if unknown."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: "Exact commands and configuration (redacted)."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "Logs, SHADOW report, test output. Redact sensitive data."
